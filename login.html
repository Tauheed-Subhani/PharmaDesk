<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - PharmaDesk</title>
  <!-- Bootstrap and Bootstrap Icons from CDN (internet needed) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

  <div class="row g-0 min-vh-100">

    <!-- LEFT: brand panel (hidden on phones) -->
    <div class="col-lg-5 auth-panel d-none d-lg-flex flex-column justify-content-center p-5">
      <h1 class="fw-bold"><i class="bi bi-capsule-pill"></i> PharmaDesk</h1>
      <p class="fs-5">Medicines delivered safely to your door.</p>
      <p class="mb-2"><i class="bi bi-check-circle"></i> Prescriptions checked by a pharmacist</p>
      <p class="mb-2"><i class="bi bi-check-circle"></i> Track every order in one place</p>
      <p class="mb-0"><i class="bi bi-check-circle"></i> Secure delivery with an order OTP</p>
    </div>

    <!-- RIGHT: form -->
    <div class="col-lg-7 d-flex flex-column justify-content-center align-items-center p-4">
      <a class="brand d-lg-none mb-3" href="index.html"><i class="bi bi-capsule-pill"></i> PharmaDesk</a>
      <div class="card w-100" style="max-width: 460px;">
        <div class="card-body p-4">
          <h3 class="mb-1">Welcome back</h3>
          <p class="text-muted mb-4">Log in to your account</p>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-4">
              <label for="role" class="form-label">Log in as</label>
              <!-- Demo only: each value is the page to open -->
              <select class="form-select" id="role">
                <option value="customer-home.html">Customer</option>
                <option value="pharmacist-home.html">Pharmacist</option>
                <option value="admin-home.html">Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-brand w-100">Log in</button>
          </form>

          <p class="text-center text-muted mt-3 mb-0">New here? <a href="signup.html" class="text-brand">Create account</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // No real login yet: just open the page of the chosen role
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      window.location.href = document.getElementById("role").value;
    });
  </script>
</body>
</html>
