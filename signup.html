<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - PharmaDesk</title>
  <!-- Bootstrap and Bootstrap Icons from CDN (internet needed) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Our own colours and small tweaks -->
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="row g-0 min-vh-100">

    <!-- LEFT: brand panel (hidden on phones) -->
    <div class="col-lg-5 auth-panel d-none d-lg-flex flex-column justify-content-center p-5">
      <h1 class="fw-bold"><i class="bi bi-capsule-pill"></i> PharmaDesk</h1>
      <p class="fs-5">Medicines delivered safely to your door.</p>
      <p class="mb-2"><i class="bi bi-check-circle"></i> Prescriptions checked by a pharmacist</p>
      <p class="mb-2"><i class="bi bi-check-circle"></i> Track every order in one place</p>
      <p class="mb-0"><i class="bi bi-check-circle"></i> Secure delivery with an order OTP</p>
    </div>

    <!-- RIGHT: form -->
    <div class="col-lg-7 d-flex flex-column justify-content-center align-items-center p-4">
      <a class="brand d-lg-none mb-3" href="index.html"><i class="bi bi-capsule-pill"></i> PharmaDesk</a>
      <div class="card w-100" style="max-width: 460px;">
        <div class="card-body p-4">
          <h3 class="mb-1">Create your account</h3>
          <p class="text-muted mb-4">Customer sign up</p>

          <form id="signupForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Delivery address</label>
              <textarea class="form-control" id="address" rows="2" required></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="confirm" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm" required>
                <div class="invalid-feedback">Passwords do not match.</div>
              </div>
            </div>
            <button type="submit" class="btn btn-brand w-100">Create account</button>
          </form>

          <p class="text-center text-muted mt-3 mb-0">Already have an account? <a href="login.html" class="text-brand">Log in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Check that both passwords match before continuing
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var confirmBox = document.getElementById("confirm");
      if (document.getElementById("password").value !== confirmBox.value) {
        confirmBox.classList.add("is-invalid");   // shows the red error message
      } else {
        window.location.href = "customer-home.html";
      }
    });
  </script>
</body>
</html>
